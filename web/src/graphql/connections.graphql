# The caller's connections (specs/connections.md, REQ-CONN-001).
query Connections {
  connections {
    id
    catalogEntryId
    displayName
    description
    url
    authType
    headerName
    headerPrefix
    hasApiKey
    oauthClientId
    hasClientSecret
    setupState
    iconUrl
    enabled
  }
}

# Enables or disables a connection (REQ-CONN-051).
mutation SetConnectionEnabled($id: ID!, $enabled: Boolean!) {
  setConnectionEnabled(id: $id, enabled: $enabled) {
    id
    setupState
    enabled
  }
}

# Adds a custom server (REQ-CONN-020).
mutation CreateConnection($input: CreateConnectionInput!) {
  createConnection(input: $input) {
    id
  }
}

# Changes a custom server (REQ-CONN-023, REQ-CONN-042). Selects every field
# the Connections query has, so Apollo updates the cached connection by id.
mutation UpdateConnection($id: ID!, $input: UpdateConnectionInput!) {
  updateConnection(id: $id, input: $input) {
    id
    catalogEntryId
    displayName
    description
    url
    authType
    headerName
    headerPrefix
    hasApiKey
    oauthClientId
    hasClientSecret
    setupState
    iconUrl
    enabled
  }
}

# Removes a connection with its credentials (REQ-CONN-052).
mutation RemoveConnection($id: ID!) {
  removeConnection(id: $id)
}
