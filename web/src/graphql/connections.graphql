# The caller's connections (specs/connections.md, REQ-CONN-001).
query Connections {
  connections {
    id
    catalogEntryId
    displayName
    description
    url
    authType
    headerName
    headerPrefix
    hasApiKey
    oauthClientId
    hasClientSecret
    setupState
    iconUrl
    enabled
    status
    toolCount
  }
}

# Enables or disables a connection (REQ-CONN-051).
mutation SetConnectionEnabled($id: ID!, $enabled: Boolean!) {
  setConnectionEnabled(id: $id, enabled: $enabled) {
    id
    setupState
    enabled
    status
  }
}

# Adds a custom server (REQ-CONN-020).
mutation CreateConnection($input: CreateConnectionInput!) {
  createConnection(input: $input) {
    id
  }
}

# Changes a custom server (REQ-CONN-023, REQ-CONN-042). Selects every field
# the Connections query has, so Apollo updates the cached connection by id.
mutation UpdateConnection($id: ID!, $input: UpdateConnectionInput!) {
  updateConnection(id: $id, input: $input) {
    id
    catalogEntryId
    displayName
    description
    url
    authType
    headerName
    headerPrefix
    hasApiKey
    oauthClientId
    hasClientSecret
    setupState
    iconUrl
    enabled
    status
    toolCount
  }
}

# Queues a sync of a connection's tools (T18). The new count arrives
# through ConnectionToolsSynced once the sync finishes.
mutation ResyncTools($id: ID!) {
  resyncTools(id: $id) {
    id
    toolCount
  }
}

# Removes a connection with its credentials (REQ-CONN-052).
mutation RemoveConnection($id: ID!) {
  removeConnection(id: $id)
}

# Sends a connection each time the status of its upstream client changes
# (T17). Apollo updates the cached connection by id, so every view of it
# shows the new status.
subscription ConnectionStatusChanged {
  connectionStatusChanged {
    id
    status
  }
}

# Sends a connection each time a sync of its tools finishes, also when
# nothing changed (T18). Apollo updates the cached connection by id.
subscription ConnectionToolsSynced {
  connectionToolsSynced {
    id
    toolCount
  }
}
