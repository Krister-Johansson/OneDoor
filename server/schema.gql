"""How OneDoor authenticates to an MCP server (REQ-CONN-040)."""
enum AuthType {
  API_KEY
  NONE
  OAUTH_DCR
  OAUTH_MANUAL
}

"""
One way to connect to a catalog entry: an auth type with its URL (REQ-CONN-010).
"""
type CatalogAuthOption {
  authType: AuthType!

  """Only for API_KEY."""
  headerName: String

  """Only for API_KEY. May be empty."""
  headerPrefix: String
  url: String!
}

"""A pre-installed server that the caller can switch on."""
type CatalogEntry {
  """In the order of the AuthType enum."""
  authOptions: [CatalogAuthOption!]!

  """The caller's connection for this entry, if any (REQ-CONN-011)."""
  connection: Connection
  description: String!
  displayName: String!

  """The icon's URL path on this server (REQ-CONN-070)."""
  iconUrl: String!
  id: ID!

  """A stable identifier, such as github."""
  key: String!
}

"""Credentials to check before saving (REQ-CONN-062). Nothing is stored."""
input CheckCredentialsInput {
  """Required for API_KEY."""
  apiKey: String

  """NONE or API_KEY."""
  authType: AuthType!

  """Defaults to Authorization."""
  headerName: String

  """Defaults to Bearer."""
  headerPrefix: String
  url: String!
}

"""
A user's link to one MCP server. A catalog-based connection shows its catalog entry's name, description, URL, auth type and header settings.
"""
type Connection {
  authType: AuthType!

  """Set when the connection is based on a catalog entry."""
  catalogEntryId: ID
  createdAt: DateTime!
  description: String!

  """The server name agents see (REQ-CONN-021)."""
  displayName: String!

  """Whether the gateway uses it (REQ-CONN-051)."""
  enabled: Boolean!

  """Whether an API key is stored. The key is never returned."""
  hasApiKey: Boolean!

  """
  Whether an OAuth client secret is stored. The secret is never returned.
  """
  hasClientSecret: Boolean!

  """The header that carries the API key. Only for API_KEY."""
  headerName: String

  """Text before the API key in the header. Only for API_KEY."""
  headerPrefix: String

  """
  The icon's URL path on this server: a stored icon, or the generated letter icon (REQ-CONN-070).
  """
  iconUrl: String!
  id: ID!

  """The OAuth client id of a custom OAUTH_MANUAL connection."""
  oauthClientId: String
  setupState: SetupState!

  """
  The state of the connection's upstream client in this server. Live updates come from connectionStatusChanged.
  """
  status: ConnectionStatus!

  """
  How many tools the last tool sync stored. A failed sync and a disabled connection keep them.
  """
  toolCount: Int!

  """The tools the last tool sync stored, by name (T19)."""
  tools: [Tool!]!
  updatedAt: DateTime!
  url: String!
}

"""
The state of a connection's upstream client. OFF: no client is wanted (disabled, not READY, or an auth type without a client yet). FAILED: the last connect failed, until the next change to the connection.
"""
enum ConnectionStatus {
  CONNECTED
  CONNECTING
  FAILED
  OFF
}

"""A custom server to add (REQ-CONN-020)."""
input CreateConnectionInput {
  """Required for API_KEY, and only for it. Write-only."""
  apiKey: String
  authType: AuthType!
  description: String

  """1 to 60 characters, unique per user ignoring case."""
  displayName: String!

  """Only for API_KEY. Defaults to Authorization."""
  headerName: String

  """Only for API_KEY. Defaults to Bearer. May be empty."""
  headerPrefix: String

  """Required for OAUTH_MANUAL, and only for it."""
  oauthClientId: String

  """Required for OAUTH_MANUAL, and only for it. Write-only."""
  oauthClientSecret: String

  """https, or http only for localhost and 127.0.0.1."""
  url: String!
}

"""The result of connecting with credentials (REQ-CONN-062)."""
type CredentialsCheck {
  message: String!
  status: CredentialsStatus!
  toolCount: Int

  """The first five tool names."""
  toolNames: [String!]!
}

"""
OK: connected and listed the tools. REFUSED_CREDENTIALS: the server answered 401 or 403. The other values mean the same as in ProbeStatus.
"""
enum CredentialsStatus {
  NOT_MCP
  OK
  REFUSED
  REFUSED_CREDENTIALS
  UNREACHABLE
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type Mutation {
  """
  Connects with credentials and lists the tools. Stores nothing (REQ-CONN-062).
  """
  checkCredentials(input: CheckCredentialsInput!): CredentialsCheck!

  """Adds a custom server (REQ-CONN-020)."""
  createConnection(input: CreateConnectionInput!): Connection!

  """
  Checks a server URL without credentials. Stores nothing (REQ-CONN-060).
  """
  probeServer(url: String!): ProbeResult!

  """
  Removes a connection with its credentials, and returns its id (REQ-CONN-052).
  """
  removeConnection(id: ID!): ID!

  """
  Queues a sync of the connection's tools with its upstream server. UPSTREAM_UNAVAILABLE when the connection is not CONNECTED.
  """
  resyncTools(id: ID!): Connection!

  """Enables or disables a connection (REQ-CONN-051)."""
  setConnectionEnabled(enabled: Boolean!, id: ID!): Connection!

  """Enables or disables one of the caller's tools (T19)."""
  setToolEnabled(enabled: Boolean!, id: ID!): Tool!

  """
  Switches on a catalog entry with one of its auth options and returns the connection (REQ-CONN-012). Switch it off with setConnectionEnabled.
  """
  switchOnCatalogEntry(authType: AuthType!, catalogEntryId: ID!): Connection!

  """Changes a custom server (REQ-CONN-023, REQ-CONN-042)."""
  updateConnection(id: ID!, input: UpdateConnectionInput!): Connection!
}

"""What a server shows without credentials (REQ-CONN-060)."""
type ProbeResult {
  authRequired: Boolean!

  """The http(s) URLs of the server's own icons. Not fetched."""
  iconUrls: [String!]!

  """Why the probe ended as it did, for the user."""
  message: String!

  """Whether the server publishes OAuth metadata."""
  oauth: Boolean!

  """Whether its authorization server offers dynamic client registration."""
  oauthDcr: Boolean!
  serverDescription: String
  serverName: String
  serverTitle: String
  serverVersion: String
  status: ProbeStatus!

  """The auth type for the add dialog to pre-fill (REQ-CONN-061)."""
  suggestedAuthType: AuthType
}

"""
MCP_SERVER: answered MCP initialize. AUTH_REQUIRED: answered 401 or 403. NOT_MCP: answered, but not MCP. UNREACHABLE: no answer within 10 seconds. REFUSED: the network rules stopped the request (REQ-CONN-063).
"""
enum ProbeStatus {
  AUTH_REQUIRED
  MCP_SERVER
  NOT_MCP
  REFUSED
  UNREACHABLE
}

type Query {
  """
  Every catalog entry, sorted by display name, with the caller's connection (REQ-CONN-011).
  """
  catalog: [CatalogEntry!]!

  """One of the caller's connections. NOT_FOUND otherwise."""
  connection(id: ID!): Connection!

  """The caller's connections, sorted by display name."""
  connections: [Connection!]!
}

"""Whether the credentials of a connection are complete (REQ-CONN-044)."""
enum SetupState {
  NEEDS_CREDENTIALS
  READY
}

type Subscription {
  """Sends one of the caller's connections each time its status changes."""
  connectionStatusChanged: Connection!

  """
  Sends one of the caller's connections each time a sync of its tools finishes, with its new toolCount.
  """
  connectionToolsSynced: Connection!
}

"""
A tool of one of the caller's connections, as the last tool sync stored it.
"""
type Tool {
  annotations: ToolAnnotations!
  connectionId: ID!
  description: String!

  """
  Set by the owner (T19). A new tool is enabled, and a sync keeps the flag. The gateway does not search or execute a disabled tool.
  """
  enabled: Boolean!
  id: ID!

  """The name the upstream server uses."""
  name: String!
  title: String
}

"""
The MCP annotation hints of a tool. The upstream server sets them and may get them wrong: OneDoor shows them as labels and never enforces them. A hint the server did not send as a boolean is null.
"""
type ToolAnnotations {
  destructiveHint: Boolean
  idempotentHint: Boolean
  openWorldHint: Boolean
  readOnlyHint: Boolean
}

"""
Changes to a custom server. A field left out keeps its value. Changing the url or authType deletes the stored credentials unless the same input sets new ones (REQ-CONN-023).
"""
input UpdateConnectionInput {
  """Left out keeps the stored key, null deletes it, a string replaces it."""
  apiKey: String
  authType: AuthType

  """null clears the description."""
  description: String
  displayName: String
  headerName: String
  headerPrefix: String
  oauthClientId: String

  """
  Left out keeps the stored secret, null deletes it, a string replaces it.
  """
  oauthClientSecret: String
  url: String
}
